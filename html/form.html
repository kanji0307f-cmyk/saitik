<!DOCTYPE html>

<html lang="ru">

  <head>
    <title>Пример формы HTML</title>
  </head>

  <body>

    <h1>Пример формы HTML</h1>

    <form action="/"
      method="POST">

      <label>
        фио:<br />
        <input name="field-name-1"
          placeholder=" поле фио" />
      </label><br />

      <label>
        номер:<br />
        <input name="field-email"
          type="tel"
          placeholder="поле tel" />
      </label><br />

      <label>
        Текстовое поле даты:<br />
        <input name="field-date"
          value="0000-00-00"
          type="date" />
      </label><br />

      Радиокнопки:<br />
      <label><input type="radio" checked="checked"
        name="radio-group-1" value="Значение1" />
        мужской</label>
      <label><input type="radio"
        name="radio-group-1" value="Значение2" />
        женский</label><br />

        <label>
        любимый язык программирования:<br />
        <br />
        <select name="field-name-4[]"
          multiple="multiple">
          <option value="Значение1"selected="selected">Python</option>
          <option value="Значение2" selected="selected">JavaScript</option>
          <option value="Значение3" selected="selected">Java</option>\
          <option value="Значение1"selected="selected">С++</option>
          <option value="Значение2" selected="selected">С#</option>
          <option value="Значение3" selected="selected">PHP</option>
          <option value="Значение1"selected="selected">Haskel</option>
          <option value="Значение2" selected="selected">Prolog</option>
          <option value="Значение3" selected="selected">Scala</option>
        </select>
      </label><br />
      <label>
        биография:<br />
        <textarea name="field-name-2" placeholder="Введите вашу биографию"></textarea>
      </label><br />

      с контрактом ознакомлен:<br />
      <label><input type="checkbox" checked="checked"
        name="check-1" />
        подтвердить</label><br />

        <input type="submit" value="сохранить" />

      
    </form>

  </body>

</html>
